[project]
name = "resume"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pypdf>=6.14.2",
]

[dependency-groups]
dev = [
    "djlint>=1.40.6",
    "pre-commit>=4.6.0",
]

# codespell has no French dictionary, so it only checks English content.
# Skip the French-language documents (FR CVs + cover letters) to avoid
# false positives; English files (EN CVs, index.html) are still checked.
[tool.codespell]
skip = "*.pdf,*_FR_2026*.tex,*/Cover_Letters/*"
